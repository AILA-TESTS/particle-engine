<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    #session-info { font-size: 13px; color: #888; }
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    #canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      position: relative;
    }
    #grid-canvas {
      border: 1px solid #333;
    }
    #sidebar {
      width: 360px;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      background: #151515;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .log-entry { margin-bottom: 8px; padding: 6px 8px; border-radius: 4px; }
    .log-user { background: #1a2a1a; border-left: 3px solid #4a8; }
    .log-assistant { background: #1a1a2a; border-left: 3px solid #48a; }
    .log-tool { background: #2a1a1a; border-left: 3px solid #a84; font-size: 12px; }
    .log-error { background: #2a1a1a; border-left: 3px solid #a44; }
    .log-status { color: #666; font-style: italic; }
    #prompt-area {
      padding: 12px;
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
    }
    #prompt-input {
      flex: 1;
      background: #222;
      border: 1px solid #444;
      color: #e0e0e0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    #prompt-input:focus { outline: none; border-color: #666; }
    #send-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #send-btn:hover { background: #1d4ed8; }
    #send-btn:disabled { background: #444; cursor: not-allowed; }
    #status-bar {
      padding: 6px 20px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      font-size: 12px;
      color: #888;
      display: flex;
      gap: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Particle Engine</h1>
    <span id="session-info">No session</span>
  </header>
  <main>
    <div id="canvas-container">
      <canvas id="grid-canvas"></canvas>
    </div>
    <div id="sidebar">
      <div id="log"></div>
      <div id="prompt-area">
        <input id="prompt-input" type="text" placeholder="Describe what to create..." />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </main>
  <div id="status-bar">
    <span id="status-particles">Particles: 0</span>
    <span id="status-connections">Connections: 0</span>
    <span id="status-server">Server: disconnected</span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
